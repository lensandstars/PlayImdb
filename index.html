 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PlayIMDb Media Finder</title>

  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d6efd">
<link rel="apple-touch-icon" href="icons/icon-192.png">

  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #212529;
      --text-muted: #6c757d;
      --accent: #0d6efd;
      --border-color: #dee2e6;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
    }

    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      display: flex;
      justify-content: center;
      padding-top: 5vh;
    }

    .container { width: 92%; max-width: 450px; }

    .search-wrapper {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 4px;
      border: 1px solid var(--border-color);
    }

    input {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: none;
      outline: none;
      background: transparent;
      box-sizing: border-box;
    }

    .dropdown {
      background: var(--card-bg);
      border-radius: 12px;
      margin-top: 12px;
      max-height: 70vh;
      overflow-y: auto;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      display: none;
    }

    .dropdown:not(:empty) { display: block; }

    .item {
      display: flex;
      gap: 16px;
      padding: 12px;
      cursor: pointer;
      align-items: center;
      border-bottom: 1px solid #f1f3f5;
    }

    .item:active { background: #e9ecef; }

    img {
      width: 50px;
      height: 75px;
      object-fit: cover;
      border-radius: 6px;
      background-color: #e9ecef;
    }

    .title { font-weight: 600; font-size: 15px; }
    .badge {
      font-size: 10px;
      text-transform: uppercase;
      background: #eee;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 5px;
      color: var(--text-muted);
    }
    small { color: var(--text-muted); font-size: 13px; }
  </style>
</head>
<body>

<div class="container">
  <div class="search-wrapper">
    <input id="search" placeholder="Search Movies, TV Shows..." autocomplete="off" />
  </div>
  <div id="dropdown" class="dropdown"></div>
</div>

<script>
const API_KEY = "bb0bd9039fd44182ecda8e901d5ef8a4";
const input = document.getElementById("search");
const dropdown = document.getElementById("dropdown");

let timeout = null;
let cache = {};

input.addEventListener("input", () => {
  clearTimeout(timeout);
  const query = input.value.trim();
  if (!query) { dropdown.innerHTML = ""; return; }

  timeout = setTimeout(() => {
    // Multi-search allows TV, Movies, and People
    fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}`)
      .then(res => res.json())
      .then(data => {
        dropdown.innerHTML = "";
        if (!data.results) return;

        data.results.slice(0, 10).forEach(item => {
          if (item.media_type === 'person') return; // Skip people

          const div = document.createElement("div");
          div.className = "item";
          
          const title = item.title || item.name;
          const date = item.release_date || item.first_air_date || "";
          const year = date ? date.slice(0, 4) : "—";
          const poster = item.poster_path 
            ? `https://image.tmdb.org/t/p/w92${item.poster_path}` 
            : "https://via.placeholder.com/92x138?text=No+Image";

          div.innerHTML = `
            <img src="${poster}">
            <div>
              <div class="title">${title} <span class="badge">${item.media_type}</span></div>
              <small>${year}</small>
            </div>
          `;

          div.onclick = async () => {
            let imdbID = cache[item.id];
            if (!imdbID) {
              // Fetch specific details to get external IDs
              const res = await fetch(`https://api.themoviedb.org/3/${item.media_type}/${item.id}?api_key=${API_KEY}&append_to_response=external_ids`);
              const details = await res.json();
              imdbID = details.imdb_id || (details.external_ids ? details.external_ids.imdb_id : null);
              cache[item.id] = imdbID;
            }

            if (imdbID) {
              // Opening in a new tab/window is the most reliable way to avoid 500 errors in PWAs/APKs
              window.open(`https://www.playimdb.com/title/${imdbID}/`, '_blank');
            } else {
              alert("IMDb ID not found for this media.");
            }
          };
          dropdown.appendChild(div);
        });
      });
  }, 250);
});
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js")
    .then(() => console.log("Service Worker Registered"));
}
</script>

</body>
</html>
